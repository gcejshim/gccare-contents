<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>약관동의 디자인 샘플 · GC Care</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ============================================================
   1. 디자인 토큰 — 이 값만 쓰세요 (DESIGN.md 2장)
   ============================================================ */
:root{
  /* ── 0. 어떠케어 디자인 시스템 전체 (Figma Foundation › Color) ──
     Global Token = 모든 색 단계, Alias Token = 역할 이름. 필요한 색은 여기서 골라 쓰세요. */
  --common-white:#ffffff; --common-black:#000000;
  --neutral-0:#ffffff; --neutral-50:#f7f7f7; --neutral-100:#e6e6e6; --neutral-200:#d5d5d5; --neutral-300:#b0b0b0; --neutral-400:#9b9b9b; --neutral-500:#8a8a8a; --neutral-600:#6c6c6c; --neutral-700:#474747; --neutral-800:#2a2a2a; --neutral-900:#111111;
  --coolNeutral-0:#ffffff; --coolNeutral-50:#f7f7fb; --coolNeutral-100:#e8eaef; --coolNeutral-200:#ccd1d6; --coolNeutral-300:#a9b0b7; --coolNeutral-400:#919ba5; --coolNeutral-500:#828d92; --coolNeutral-600:#676e71; --coolNeutral-700:#454849; --coolNeutral-800:#292a2b; --coolNeutral-900:#1b1b1b;
  --careGreen-10:#f5fff8; --careGreen-50:#d1fadd; --careGreen-100:#a9f5c3; --careGreen-200:#7be8a5; --careGreen-300:#51db8b; --careGreen-400:#2bcf75; --careGreen-500:#0ac262; --careGreen-600:#009c50; --careGreen-700:#007541; --careGreen-800:#004f2e; --careGreen-900:#002919;
  --careBlue-10:#f5fbff; --careBlue-50:#f0f8ff; --careBlue-100:#d6eaff; --careBlue-200:#add3ff; --careBlue-300:#85baff; --careBlue-400:#5998f7; --careBlue-500:#2f74eb; --careBlue-600:#1d55c4; --careBlue-700:#002a8c; --careBlue-800:#062478; --careBlue-900:#031552;
  --careRed-10:#fffafa; --careRed-50:#fff1f0; --careRed-100:#ffccc7; --careRed-200:#ffa39e; --careRed-300:#ff7875; --careRed-400:#ff4d4f; --careRed-500:#f5222d; --careRed-600:#cf1322; --careRed-700:#a8071a; --careRed-800:#820014; --careRed-900:#5c0011;
  --careYellow-10:#fffff5; --careYellow-50:#feffe6; --careYellow-100:#ffffb8; --careYellow-200:#fffb8f; --careYellow-300:#fff566; --careYellow-400:#ffec3d; --careYellow-500:#facc00; --careYellow-600:#d4b106; --careYellow-700:#ad8b00; --careYellow-800:#876800; --careYellow-900:#614700;
  --careOrange-10:#fffcf5; --careOrange-50:#fff7e6; --careOrange-100:#ffe7ba; --careOrange-200:#ffd591; --careOrange-300:#ffc069; --careOrange-400:#ffa940; --careOrange-500:#fa8b14; --careOrange-600:#d46b08; --careOrange-700:#ad4e00; --careOrange-800:#873800; --careOrange-900:#612500;
  --volcano-10:#fff9f5; --volcano-50:#fff2e8; --volcano-100:#ffd8bf; --volcano-200:#ffbb96; --volcano-300:#ff9c6e; --volcano-400:#ff7a45; --volcano-500:#fa541c; --volcano-600:#d4380d; --volcano-700:#ad2102; --volcano-800:#871400; --volcano-900:#610b00;
  --lime-10:#fefff5; --lime-50:#fcffe6; --lime-100:#f4ffb8; --lime-200:#eaff8f; --lime-300:#d3f261; --lime-400:#bae637; --lime-500:#a0d911; --lime-600:#7cb305; --lime-700:#5b8c00; --lime-800:#3f6600; --lime-900:#254000;
  --cyan-10:#f5fffd; --cyan-50:#e6fffb; --cyan-100:#b5f5ec; --cyan-200:#87e8de; --cyan-300:#5cdbd3; --cyan-400:#36cfc9; --cyan-500:#13c2c2; --cyan-600:#08979c; --cyan-700:#006d75; --cyan-800:#00474f; --cyan-900:#002329;
  --blue-10:#fafcff; --blue-50:#f0f5ff; --blue-100:#d6e4ff; --blue-200:#adc6ff; --blue-300:#85a5ff; --blue-400:#597ef7; --blue-500:#2f54eb; --blue-600:#1d39c4; --blue-700:#10239e; --blue-800:#061178; --blue-900:#030852;
  --purple-10:#fdfaff; --purple-50:#f9f0ff; --purple-100:#efdbff; --purple-200:#d3adf7; --purple-300:#b37feb; --purple-400:#9254de; --purple-500:#722ed1; --purple-600:#531dab; --purple-700:#391085; --purple-800:#22075e; --purple-900:#120338;
  --magenta-10:#fffafc; --magenta-50:#fff0f6; --magenta-100:#ffd6e7; --magenta-200:#ffadd2; --magenta-300:#ff85c0; --magenta-400:#f759ab; --magenta-500:#eb2f96; --magenta-600:#c41d7f; --magenta-700:#9e1068; --magenta-800:#780650; --magenta-900:#520339;
  /* Alias Token (역할) */
  --brand-primary-normal:var(--careGreen-500); /* 메인 녹색 */
  --brand-primary-strong:var(--careGreen-600); /* 눌림 · 녹색 글자 */
  --brand-primary-heavy:var(--careGreen-700);
  --brand-secondary:var(--careBlue-700);
  --brand-tertiary:var(--careYellow-500);
  --status-informat:var(--careBlue-500); /* 정보 */
  --status-negative:var(--careRed-500); /* 오류 · 경고 */
  --status-positive:var(--careGreen-500); /* 성공 */
  --status-cautionary:var(--careOrange-500); /* 주의 */
  --basic-volcano:var(--volcano-500);
  --basic-lime:var(--lime-500);
  --basic-cyan:var(--cyan-500);
  --basic-blue:var(--blue-400);
  --basic-purple:var(--purple-500);
  --basic-magenta:var(--magenta-500);
  --background-normal:var(--neutral-0);
  --background-alternative:var(--neutral-50);
  --line-normal:var(--neutral-100);
  --line-accent:var(--neutral-200);
  --line-divider:var(--neutral-300);
  --inverse-primary:var(--careGreen-500);
  --inverse-static:var(--common-black);

  /* ── 이 화면에서 쓰는 이름 → 위 토큰 연결 ── */
  --brand-primary:var(--brand-primary-normal);
  --brand-strong:var(--brand-primary-strong);
  --brand-heavy:var(--brand-primary-heavy);
  --green-10:var(--careGreen-10);
  --green-50:var(--careGreen-50);
  --bg-normal:var(--background-normal);
  --bg-alt:var(--background-alternative);
  --text-strong:var(--neutral-900);   /* 글자 검정 = #111111 */
  --text-sub:var(--coolNeutral-600);
  --error:var(--status-negative);
  --dim:rgba(17,17,17,.5);

  /* 글자 */
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --fs-title:22px; --fs-lg:18px; --fs-md:16px; --fs-sm:14px; --fs-xs:12px;

  /* 간격 · 크기 */
  --gutter:20px;          /* 화면 좌우 여백 */
  --row-h:52px;           /* 약관 줄 높이 */
  --btn-h:56px;           /* 하단 버튼 높이 */
  --icon:24px;            /* 체크 아이콘 */

  /* 모서리 */
  --r-card:12px; --r-btn:12px; --r-sheet:20px; --r-check:6px;
}

/* ============================================================
   2. 컴포넌트 — 이 부분을 복사해서 쓰세요
   ============================================================ */
.consent{position:relative;display:flex;flex-direction:column;height:100%;background:var(--bg-normal);font-family:var(--font);color:var(--text-strong);word-break:keep-all;overflow:hidden}
.consent__body{flex:1;overflow-y:auto;padding:40px var(--gutter) 24px}
.consent__title{margin:0 0 8px;font-size:var(--fs-title);font-weight:700;line-height:1.4;letter-spacing:-.02em}
.consent__desc{margin:0 0 32px;font-size:var(--fs-sm);line-height:1.5;color:var(--text-sub)}

/* 체크 아이콘 (공통) */
.check{flex:none;width:var(--icon);height:var(--icon);border-radius:50%;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px}
.check--box{border:1.5px solid var(--line-accent);background:var(--bg-normal)}
.check--box svg{stroke:var(--bg-normal)}
.is-on .check--box{border-color:var(--brand-primary);background:var(--brand-primary)}
.check--line svg{width:20px;height:20px;stroke:var(--line-accent);transition:stroke .15s}
.is-on .check--line svg{stroke:var(--brand-primary)}

/* 전체 동의 카드 */
.agree-all{display:flex;align-items:center;gap:12px;width:100%;padding:18px 20px;margin-bottom:12px;border:1.5px solid transparent;border-radius:var(--r-card);background:var(--bg-alt);font:inherit;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.agree-all.is-on{background:var(--green-10);border-color:var(--green-50)}
.agree-all__txt b{display:block;font-size:var(--fs-lg);font-weight:700;line-height:1.4}
.agree-all__txt span{display:block;margin-top:2px;font-size:var(--fs-sm);color:var(--text-sub)}

/* 약관 줄 */
.terms{list-style:none;margin:0;padding:0 0 0 4px}
.term{display:flex;align-items:flex-start;min-height:var(--row-h)}
.term__check{flex:1;display:flex;align-items:flex-start;gap:12px;padding:14px 0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.term__check .check{margin-top:0}
.term__label{font-size:var(--fs-md);font-weight:500;line-height:1.5}
.tag{margin-right:4px;font-weight:600}
.tag--req{color:var(--brand-strong)}
.tag--opt{color:var(--text-sub)}
.term__view{flex:none;width:44px;height:var(--row-h);margin-right:-12px;display:grid;place-items:center;border:0;background:none;cursor:pointer}
.term__view svg{width:20px;height:20px;stroke:var(--line-divider)}

/* 안내 · 오류 문구 (필수를 안 고르고 버튼을 누를 때) */
.consent__error{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:var(--fs-sm);font-weight:500;color:var(--error)}
.consent__error[hidden]{display:none}
.consent__error svg{width:16px;height:16px;flex:none;stroke:var(--error)}
.term.is-missing .tag--req{color:var(--error)}

/* 하단 버튼 */
.consent__foot{padding:12px var(--gutter) 24px;background:var(--bg-normal)}
.btn{width:100%;height:var(--btn-h);border:0;border-radius:var(--r-btn);font:inherit;font-size:var(--fs-md);font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.btn--primary{background:var(--brand-primary);color:var(--bg-normal)}
.btn--primary:not(:disabled):active{background:var(--brand-strong)}
.btn--primary:disabled{background:var(--line-normal);color:var(--line-divider);cursor:default}

/* 약관 보기 바텀시트 */
.sheet-dim{position:absolute;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;display:flex;flex-direction:column;background:var(--bg-normal);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(100%);transition:transform .25s ease}
.is-sheet .sheet-dim{opacity:1;pointer-events:auto}
.is-sheet .sheet{transform:none}
.sheet__handle{width:40px;height:4px;margin:10px auto 0;border-radius:2px;background:var(--line-accent)}
.sheet__head{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gutter) 12px}
.sheet__title{margin:0;font-size:var(--fs-lg);font-weight:700}
.sheet__close{width:44px;height:44px;margin-right:-12px;display:grid;place-items:center;border:0;background:none;cursor:pointer}
.sheet__close svg{width:22px;height:22px;stroke:var(--text-strong)}
.sheet__body{flex:1;overflow-y:auto;margin:0 var(--gutter);padding:16px;border-radius:var(--r-card);background:var(--bg-alt);font-size:var(--fs-sm);line-height:1.65;color:var(--text-sub)}
.sheet__body h4{margin:0 0 6px;font-size:var(--fs-sm);font-weight:600;color:var(--text-strong)}
.sheet__body p{margin:0 0 16px}

/* 누를 때 · 키보드 포커스 */
.agree-all:active,.term__check:active{opacity:.7}
button:focus-visible{outline:2px solid var(--brand-primary);outline-offset:2px;border-radius:8px}

/* ============================================================
   3. 도구 상단 바 — AX Studio와 같은 모양 (도구 화면에 그대로 쓰세요)
   ============================================================ */
.topbar{position:sticky;top:0;z-index:20;height:62px;display:flex;align-items:center;gap:14px;padding:0 20px;font-family:var(--font);letter-spacing:-0.2px;
  background:radial-gradient(ellipse 38% 180% at 58% 50%, rgba(10,194,98,.22), rgba(10,194,98,0) 70%), radial-gradient(ellipse 30% 160% at 20% 50%, rgba(47,116,235,.25), rgba(47,116,235,0) 70%), var(--careBlue-900);color:#fff}
.topbar__brand{display:flex;align-items:center;gap:12px;flex:none;min-width:200px;padding-right:12px}
.topbar__brand img{height:18px;width:auto;display:block}
.topbar__brand span{flex:none;width:1px;height:14px;background:rgba(255,255,255,.3)}
.topbar__brand h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.topbar__nav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:4px 6px}
.topbar__nav button{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:#fff;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.topbar__nav button:hover{background:rgba(255,255,255,.14)}
.topbar__nav b{font-size:15px;min-width:44px;text-align:center;white-space:nowrap}
.topbar__nav svg{width:1em;height:1em}
.topbar__nav svg path{fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.topbar__sp{flex:1}
.topbar__btn{height:34px;padding:0 13px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:500;white-space:nowrap}
.topbar__btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
@media (max-width:760px){.topbar__btn{display:none}.topbar__brand{min-width:0}}

/* ============================================================
   4. 샘플 보기 화면 (전달용 — 실제 서비스에는 필요 없음)
   ============================================================ */
body{margin:0;background:#eceef3;font-family:var(--font);color:var(--text-strong)}
.gallery-head{max-width:1300px;margin:0 auto;padding:40px 24px 8px}
.gallery-head h1{margin:0 0 6px;font-size:24px}
.gallery-head p{margin:0;color:var(--text-sub);font-size:14px;line-height:1.6}
.gallery{max-width:1300px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:40px;justify-content:center}
.frame-wrap h2{margin:0 0 4px;font-size:15px}
.frame-wrap small{display:block;margin-bottom:12px;font-size:13px;color:var(--text-sub)}
.frame{width:390px;height:780px;border-radius:28px;overflow:hidden;box-shadow:0 8px 30px rgba(3,21,82,.12)}
@media (max-width:430px){.frame{width:calc(100vw - 48px)}}
</style>
</head>

      </ul>
    </div>
    <div class="consent__foot"><p class="consent__error" role="alert" hidden>${ICON.alert}필수 항목에 모두 동의해 주세요.</p><button type="button" class="btn btn--primary btn--start">동의하고 시작하기</button></div>
    <div class="sheet-dim"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet__handle"></div>
      <div class="sheet__head"><h2 class="sheet__title"></h2><button type="button" class="sheet__close" aria-label="닫기">${ICON.close}</button></div>
      <div class="sheet__body">${SAMPLE_BODY}</div>
      <div class="consent__foot"><button type="button" class="btn btn--primary sheet__agree">동의하기</button></div>
    </div>
  </div>`;

  const $ = s => root.querySelector(s), el = $('.consent');
  let sheetId = null, showErr = preset === 'error';

  function render(){
    const all = TERMS.every(t => state[t.id]);
    const reqOK = TERMS.filter(t => t.required).every(t => state[t.id]);
    $('.agree-all').classList.toggle('is-on', all);
    $('.agree-all').setAttribute('aria-pressed', all);
    root.querySelectorAll('.term').forEach(li => {
      const on = state[li.dataset.id];
      li.querySelector('.term__check').classList.toggle('is-on', on);
      li.querySelector('.term__check').setAttribute('aria-pressed', on);
    });
    if (showErr && reqOK) showErr = false;   // 필수를 다 고르면 안내가 사라짐
    $('.consent__error').hidden = !showErr;
    root.querySelectorAll('.term').forEach(li => { const t = TERMS.find(x => x.id === li.dataset.id); li.classList.toggle('is-missing', showErr && t.required && !state[t.id]); });
  }
  function openSheet(id){
    sheetId = id;
    const t = TERMS.find(x => x.id === id);
    $('.sheet__title').textContent = t.label;
    el.classList.add('is-sheet');
  }
  const closeSheet = () => { el.classList.remove('is-sheet'); sheetId = null; };

  $('.agree-all').onclick = () => { const v = !TERMS.every(t => state[t.id]); TERMS.forEach(t => state[t.id] = v); render(); };
  root.querySelectorAll('.term').forEach(li => {
    li.querySelector('.term__check').onclick = () => { state[li.dataset.id] = !state[li.dataset.id]; render(); };
    li.querySelector('.term__view').onclick = () => openSheet(li.dataset.id);
  });
  $('.btn--start').onclick = () => { if (!TERMS.filter(t => t.required).every(t => state[t.id])){ showErr = true; render(); } };   // 필수가 빠지면 빨간 안내
  $('.sheet__close').onclick = closeSheet;
  $('.sheet-dim').onclick = closeSheet;
  $('.sheet__agree').onclick = () => { state[sheetId] = true; closeSheet(); render(); };

  render();
  if (preset === 'sheet') openSheet('service');
}

document.querySelectorAll('[data-consent]').forEach(f => mountConsent(f, f.dataset.consent));
</script>
</body>
</html>
